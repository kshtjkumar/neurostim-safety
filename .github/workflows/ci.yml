# Security note: no `github.event.*` value is interpolated into any `run:` block in
# this workflow. The only expressions used are `matrix.*`, `runner.os`, and
# `github.workflow`/`github.ref` inside `concurrency`, none of which are
# attacker-controlled, so there is no workflow-injection surface here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        # PyQt6 needs its platform plugin libraries present even to construct widgets
        # offscreen, which the GUI tests do.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: pytest -q

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check neurostim tests examples

      - name: Mypy
        run: mypy neurostim

  literature:
    name: Literature provenance
    runs-on: ubuntu-latest
    # The value of this package is that every constant traces to a source, and these
    # tests are what enforce it. They get their own job because a failure here means a
    # number drifted from its publication, which is a different class of problem from
    # an ordinary bug.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify every constant against its primary source
        run: pytest tests/test_literature.py -v

      - name: Reproduce published results from published inputs
        run: pytest tests/test_published_cases.py -v

      - name: Report provenance gaps
        run: python scripts/provenance_audit.py

      - name: Verify transcribed constants against source PDFs
        # Papers are not redistributed with the repo, so this is informational in CI
        # and authoritative when run locally against the paper library.
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python scripts/verify_transcriptions.py
