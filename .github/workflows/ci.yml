# Security note: no `github.event.*` value is interpolated into any `run:` block in
# this workflow. The only expressions used are `matrix.*`, `runner.os`, and
# `github.workflow`/`github.ref` inside `concurrency`, none of which are
# attacker-controlled, so there is no workflow-injection surface here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          # the ledger tests resolve recorded commit ids against the full history
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime dependencies and poppler
        if: runner.os == 'Linux'
        # PyQt6 needs its platform plugin libraries present even to construct widgets
        # offscreen, which the GUI tests do. poppler-utils gives pdftotext, without which
        # the tests that read the generated PDF report's text skip (T21).
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 xvfb

      - name: Install poppler
        if: runner.os == 'macOS'
        run: brew install poppler

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        # Linux runners have no display, so matplotlib refuses the Qt backend the GUI
        # tests need ("headless is currently running"); xvfb-run provides one.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pytest -q; else pytest -q; fi

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger gate asserts that every commit id CODE_MISTAKES_LOG.md records is
          # a commit that exists. actions/checkout defaults to fetch-depth: 1, which
          # leaves no historical object to look one up in, so the gate would skip the
          # assertion here (see scripts/ledger_check.py) on a ledger that is correct.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # numpy's newer stubs use Python 3.12-only syntax, which mypy (python_version
          # 3.10) cannot parse; pin the version the type check was validated against.
          python -m pip install "numpy==2.4.1"

      - name: Ruff
        run: ruff check neurostim tests examples

      - name: Mypy
        # The tests are type-checked too (T26): a test that reads an Optional without
        # narrowing it fails on None with an AttributeError instead of an assertion.
        run: mypy neurostim tests

      - name: Generated README transcript is current
        # The README quick-start block is output, not prose. It was stale by a whole
        # release at the audit baseline: five checks and 70.69 uA against the nine checks
        # and 141.4 uA the package prints.
        run: python scripts/regenerate_example_output.py --check

      - name: Mistakes ledger parses and is fully scheduled
        # Rows 8 and 46 once carried unescaped pipes and split into 11 and 9 fields
        # against the header's 7, so two defects had silently left the record.
        run: python scripts/ledger_check.py

  coverage:
    name: Branch-point coverage floor
    runs-on: ubuntu-latest
    # coverage.py's headline branch figure counts *arcs*, so a decision whose else-side
    # is never taken still scores 50 %. This job re-aggregates coverage.py's own JSON
    # output to branch *points* -- decisions with every exit exercised -- because that
    # is the quantity the audit measured: 48.30 % against a blended line+branch total of
    # 88.15 %. `--cov-fail-under` would gate the latter and can never ratchet the
    # former, so the metric lives in scripts/branch_floor.py where it can be reviewed.
    steps:
      - uses: actions/checkout@v4
        with:
          # the ledger tests resolve recorded commit ids against the full history
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies and poppler
        # The same system packages as the test job (ledger 175). Without pdftotext the
        # tests that read PDF text skip, references.py falls to 16.67 % of its branch
        # points and the per-module floor fails; without the Qt libraries the GUI tests
        # skip and their modules' points go unmeasured.
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 xvfb

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Measure branch coverage
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: |
          xvfb-run -a coverage run --branch --source=neurostim -m pytest -q
          coverage json -o coverage.json

      - name: Enforce the branch-point floor
        # G3, met at C7.6: 84.77 % measured (562/663 points; the audit baseline was
        # 48.30 %), and every module of >= 4 points at or above 60 %. Raise it as coverage
        # rises; never lower it.
        run: python scripts/branch_floor.py --json coverage.json --min 84.0 --module-min 60 --module-min-points 4

  api-docs:
    name: API reference builds cleanly
    runs-on: ubuntu-latest
    # Rendered from the docstrings by pdoc, every warning an error. Built into the
    # runner's temp directory and discarded: the reference is not hosted.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        # neurostim.gui is documented too, and importing it needs the Qt libraries.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build the API reference
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_api_docs.py --output-dir "$RUNNER_TEMP/api"

  literature:
    name: Literature provenance
    runs-on: ubuntu-latest
    # The value of this package is that every constant traces to a source, and these
    # tests are what enforce it. They get their own job because a failure here means a
    # number drifted from its publication, which is a different class of problem from
    # an ordinary bug.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify every constant against its primary source
        run: pytest tests/test_literature.py -v

      - name: Reproduce published results from published inputs
        run: pytest tests/test_published_cases.py -v

      - name: Provenance gaps match the acknowledged baseline
        # --strict fails on a gap not in KNOWN_GAPS and on a listed gap that has closed.
        run: python scripts/provenance_audit.py --strict

      - name: Verify transcribed constants against source PDFs
        # Papers are not redistributed with the repo, so every claim is skipped here and
        # this step is informational in CI. The blocking form is the local release gate
        # in CONTRIBUTING.md: `--strict --require-papers` against the paper library.
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python scripts/verify_transcriptions.py
